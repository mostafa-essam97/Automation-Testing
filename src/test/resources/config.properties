# ============================================
# Shofha Test Automation - Configuration File
# ============================================

# Browser Configuration
browser=chrome
headless=false

# Timeouts (in seconds)
default.timeout=15
short.timeout=5
long.timeout=45
page.load.timeout=120

# URLs
simtest.base.url=https://app.simtest.it
simtest.login.url=https://app.simtest.it/login
shofha.base.url=https://shofha.net

# Test Data (Override with Environment Variables for security)
# Use environment variables: SIMTEST_USERNAME, SIMTEST_PASSWORD
simtest.username=${SIMTEST_USERNAME}
simtest.password=${SIMTEST_PASSWORD}

# Email Configuration - Using Namecheap PrivateEmail
email.smtp.host=mail.privateemail.com
email.smtp.port=587
email.smtp.ssl.port=465

# Email Credentials
email.from=alerts@shofha.net
email.password=LM5nH2dTLS

# Report Recipients (comma separated)
email.recipients=mustafa.essam@shofha.com,galal.elrihany@shofha.com,mohamed.osama@shofha.com,mohamed.abouelnaga@shofha.com

# Retry Configuration
retry.max.count=2

# Screenshot Configuration
screenshot.on.failure=true
screenshot.path=test-output/screenshots/





